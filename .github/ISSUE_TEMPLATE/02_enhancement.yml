name: '🚀 Enhancement'
description: Suggest an enhancement for this project
type: Enhancement
labels: ['needs triage :exclamation:']
title: '**enter the title of your enhancement request here**'
body:
  - type: markdown
    attributes:
      value: |
        **Enhancement Request**
        Use this when you're requesting **an enhancement to an existing feature/behavior** (not new functionality).
        Please fill out the fields below to clearly describe the enhancement you're requesting.

  - type: textarea
    attributes:
      label: What problem are you trying to solve?
      description: |
        A clear and concise description of the problem you are trying to solve.
        What is the current behavior that is problematic?
      placeholder: 'e.g. I find it difficult to …'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like.
      description: |
        A clear and concise description of what you want to happen.
        Include any specific design considerations or user interface changes you envision.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe alternatives you've considered.
      description: |
        A clear and concise description of any alternative solutions or features you've considered.
        Can you already do this, but in a less convenient way?
        Can you do this using other applications/processes?
    validations:
      required: false

  - type: textarea
    attributes:
      label: Acceptance Criteria
      description: A clear checklist of what defines this enhancement as complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Non-functional Requirements
      description: Performance, security, audit, reliability, localization, etc.
      placeholder: |
        - Performance: ...
        - Security/Permissions: ...
        - Audit/Logging: ...
        - Availability: ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Testing Notes
      description: |
        How should this be validated?
        Include edge cases and test data needs.
      placeholder: |
        Test scenarios:
          - ...
        Edge cases:
          - ...
        Test data/setup:
          - ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Implementation Notes
      description: Developer/architect notes, design considerations, technical approach.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, or any other supporting information.
    validations:
      required: false
