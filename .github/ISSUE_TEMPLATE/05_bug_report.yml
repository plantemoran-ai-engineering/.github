name: '🐛 Bug Report'
description: We broke something, again.
type: Bug
labels: ['needs triage :exclamation:']
title: '**enter the title of your bug here**'
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for reporting a bug!**
        Please make sure you read our contributing guidelines first, then fill out the fields below.

  - type: textarea
    attributes:
      label: What are the steps to reproduce this issue?
      description: |
        A clear and concise description of the steps to reproduce the behavior.
        Include as much detail as possible, such as URLs, user roles, input data, etc.
      placeholder: |
        1. Open URL https://...
        2. Click ...
        3. Type ...
        4. …
        5. Click ...
        6. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happens?
      description: |
        A clear and concise description of what the bug is.
        What is the current behavior that is unexpected or problematic?
        Include screenshots, error messages, or any other relevant details.
    validations:
      required: true

  - type: textarea
    attributes:
      label: What were you expecting to happen?
      description: |
        A clear and concise description of what was supposed to happen.
        What is the expected behavior?
        Include screenshots, mockups, or any other relevant details.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Paste any relevant logs, error output, etc.
      description: |
        Please copy and paste any relevant log output.
        This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: false

  - type: textarea
    id: bug-context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, or any other supporting information.
    validations:
      required: false
