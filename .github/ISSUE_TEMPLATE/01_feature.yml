name: '✨ Feature'
description: Propose a new feature to be added to this project
type: Feature
labels: ['needs triage :exclamation:']
title: '**enter the title of your feature request here**'
body:
  - type: markdown
    attributes:
      value: |
        **Feature Request**
        Use this when you're requesting **new functionality** (not an enhancement to an existing feature/behavior).
        Please fill out the fields below to clearly describe the feature you're requesting.

  - type: textarea
    attributes:
      label: What problem are you trying to solve?
      description: |
        A clear and concise description of the problem you are trying to solve.
        What is the current behavior that is problematic?
        What is happening today?
        Why is it a problem?
        Who is impacted?
      placeholder: 'e.g. I would like to be able to …'
    validations:
      required: true

  - type: textarea
    attributes:
      label: What is the intended outcome?
      description: |
        State the measurable value or outcome this feature should deliver.
      placeholder: |
        - Reduce manual effort from X to Y
        - Enable users to complete <task> without <workaround>
        - Improve accuracy / compliance / speed by <measure>
    validations:
      required: true

  - type: textarea
    attributes:
      label: Primary User Story
      description: |
        Write the primary user story for this feature using the format below.
        This should capture the core value proposition and intended user experience of the feature.
      placeholder: |
        As a <persona>,
        I want <capability>,
        so that <benefit/value>.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like.
      description: |
        Describe the desired behavior and any UI/workflow changes.
        Include UX notes, links, mockups, screenshots, etc.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Scope & Boundaries
      description: |
        Specify what is in and out of scope for this feature, as well as any assumptions or dependencies.
        This helps set clear expectations and avoid scope creep.
      placeholder: |
        In scope:
          - ...
        Out of scope:
          - ...
        Assumptions and dependencies:
          - ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Acceptance Criteria
      description: A clear checklist of what defines this feature as complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Non-functional Requirements
      description: Performance, security, audit, reliability, localization, etc.
      placeholder: |
        - Performance: ...
        - Security/Permissions: ...
        - Audit/Logging: ...
        - Availability: ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Testing Notes
      description: |
        How should this be validated?
        Include edge cases and test data needs.
      placeholder: |
        Test scenarios:
          - ...
        Edge cases:
          - ...
        Test data/setup:
          - ...
    validations:
      required: false

  - type: textarea
    attributes:
      label: Implementation Notes
      description: Developer/architect notes, design considerations, technical approach.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links, or any other supporting information.
    validations:
      required: false
